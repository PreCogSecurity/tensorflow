# Production Override for Docker Compose
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  tensorflow-base:
    build:
      target: runtime
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  jupyter:
    profiles: ["prod-jupyter"]
    build:
      target: runtime
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=${JUPYTER_TOKEN}
      --NotebookApp.password=${JUPYTER_PASSWORD_HASH}
      --NotebookApp.allow_origin='*'
      --NotebookApp.root_dir=/home/tensorflow
    environment:
      - TF_CPP_MIN_LOG_LEVEL=1
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - JUPYTER_PASSWORD_HASH=${JUPYTER_PASSWORD_HASH}
    volumes:
      - ./tensorflow:/home/tensorflow/tensorflow:ro
      - jupyter-data:/home/tensorflow/.jupyter
    ports:
      - "8888:8888"
    restart: unless-stopped

  tensorboard:
    build:
      target: runtime
    command: tensorboard --logdir=/home/tensorflow/logs --host=0.0.0.0 --port=6006 --reload_interval=30
    volumes:
      - ./logs:/home/tensorflow/logs:ro
    ports:
      - "6006:6006"
    restart: unless-stopped

  gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      target: runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - TF_CPP_MIN_LOG_LEVEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped