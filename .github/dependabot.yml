# Dependabot Configuration for TensorFlow
# Automatically creates PRs for dependency updates

version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "tensorflow/core-team"
    assignees:
      - "tensorflow/bot-maintainer"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      numpy:
        patterns:
          - "numpy"
        update-types:
          - "minor"
          - "patch"
      protobuf:
        patterns:
          - "protobuf"
        update-types:
          - "minor"
          - "patch"
      test-deps:
        patterns:
          - "scipy"
          - "pytest*"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        patterns:
          - "pylint"
          - "black"
          - "isort"
          - "mypy"
          - "bandit"
          - "safety"
          - "pip-audit"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for core dependencies until tested
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "six"
        update-types: ["version-update:semver-major"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "tensorflow/infra-team"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(gha)"
      include: "scope"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "tensorflow/infra-team"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"

  # Bazel dependencies (if using Bazel Central Registry)
  - package-ecosystem: "bazel"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "tensorflow/build-team"
    labels:
      - "dependencies"
      - "bazel"
    commit-message:
      prefix: "deps(bazel)"
      include: "scope"