# TensorFlow Docker Compose Configuration
# Usage:
#   Development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#   Testing:     docker-compose -f docker-compose.yml -f docker-compose.test.yml run --rm test

version: '3.8'

services:
  # Base TensorFlow service (shared configuration)
  tensorflow-base: &tensorflow-base
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tensorflow:latest
    environment:
      - TF_CPP_MIN_LOG_LEVEL=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tensorflow:/home/tensorflow/tensorflow:ro
    working_dir: /home/tensorflow
    user: "tensorflow"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

  # Development environment with all tools
  dev:
    <<: *tensorflow-base
    build:
      target: development
    image: tensorflow:dev
    container_name: tensorflow-dev
    stdin_open: true
    tty: true
    command: bash
    volumes:
      - ./tensorflow:/home/tensorflow/tensorflow:rw
      - ~/.gitconfig:/home/tensorflow/.gitconfig:ro
      - ~/.ssh:/home/tensorflow/.ssh:ro
    ports:
      - "8888:8888"  # Jupyter
      - "6006:6006"  # TensorBoard
    environment:
      - TF_CPP_MIN_LOG_LEVEL=0
      - JUPYTER_TOKEN=tensorflow-dev

  # Jupyter notebook server
  jupyter:
    <<: *tensorflow-base
    build:
      target: development
    image: tensorflow:jupyter
    container_name: tensorflow-jupyter
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=${JUPYTER_TOKEN:-tensorflow}
      --NotebookApp.password=''
      --NotebookApp.allow_origin='*'
      --NotebookApp.root_dir=/home/tensorflow
    volumes:
      - ./tensorflow:/home/tensorflow/tensorflow:ro
      - jupyter-data:/home/tensorflow/.jupyter
    ports:
      - "8888:8888"
    environment:
      - TF_CPP_MIN_LOG_LEVEL=1
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-tensorflow}

  # TensorBoard visualization
  tensorboard:
    <<: *tensorflow-base
    image: tensorflow:tensorboard
    container_name: tensorflow-tensorboard
    command: tensorboard --logdir=/home/tensorflow/logs --host=0.0.0.0 --port=6006
    volumes:
      - ./logs:/home/tensorflow/logs:rw
      - ./tensorflow:/home/tensorflow/tensorflow:ro
    ports:
      - "6006:6006"
    environment:
      - TF_CPP_MIN_LOG_LEVEL=1

  # Test runner
  test:
    <<: *tensorflow-base
    build:
      target: development
    image: tensorflow:test
    container_name: tensorflow-test
    command: >
      python -m pytest
      tensorflow/python/framework/
      -v --tb=short
      --timeout=120
      -x
      --cov=tensorflow/python
      --cov-report=term-missing
      --cov-report=xml:/home/tensorflow/coverage.xml
    volumes:
      - ./tensorflow:/home/tensorflow/tensorflow:ro
      - test-results:/home/tensorflow/test-results
      - coverage-data:/home/tensorflow/.coverage
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
      - PYTHONPATH=/home/tensorflow/tensorflow

  # Linting service
  lint:
    <<: *tensorflow-base
    build:
      target: development
    image: tensorflow:lint
    container_name: tensorflow-lint
    command: >
      bash -c "
        pylint --rcfile=.pylintrc tensorflow/python --output-format=parseable --score=yes &&
        black --check --diff tensorflow/python &&
        isort --check-only --diff tensorflow/python
      "
    volumes:
      - ./tensorflow:/home/tensorflow/tensorflow:ro
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2

  # Security scanning
  security:
    <<: *tensorflow-base
    build:
      target: development
    image: tensorflow:security
    container_name: tensorflow-security
    command: >
      bash -c "
        bandit -r tensorflow/python -f json -o /home/tensorflow/bandit-report.json &&
        safety check --json --output /home/tensorflow/safety-report.json &&
        pip-audit --format=json --output=/home/tensorflow/pip-audit-report.json
      "
    volumes:
      - ./tensorflow:/home/tensorflow/tensorflow:ro
      - security-reports:/home/tensorflow/reports
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2

  # GPU-enabled service (requires NVIDIA Container Toolkit)
  gpu:
    <<: *tensorflow-base
    build:
      context: .
      dockerfile: Dockerfile.gpu
      target: runtime
    image: tensorflow:gpu
    container_name: tensorflow-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - TF_CPP_MIN_LOG_LEVEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./tensorflow:/home/tensorflow/tensorflow:ro
    working_dir: /home/tensorflow
    command: python -c "import tensorflow as tf; print('GPU Available:', tf.config.list_physical_devices('GPU'))"

volumes:
  jupyter-data:
  test-results:
  coverage-data:
  security-reports:

networks:
  default:
    name: tensorflow-network
    driver: bridge