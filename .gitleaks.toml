# Gitleaks Configuration for TensorFlow
# Detects secrets, API keys, tokens, and other sensitive data

[allowlist]
description = "TensorFlow specific allowlist"
paths = [
  "third_party/**",
  "external/**",
  "bazel-*",
  "*.pb",
  "*.proto",
  "*.pb.cc",
  "*.pb.h",
]
commits = []
stops = []

[[rules]]
id = "tensorflow-generic-api-key"
description = "Generic API key pattern"
regex = '''(?i)(api[_-]?key|apikey|secret[_-]?key|access[_-]?token|auth[_-]?token)['"]?\s*[:=]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
tags = ["key", "api", "secret"]
entropy = 3.5

[[rules]]
id = "tensorflow-aws-keys"
description = "AWS Access Key ID and Secret Access Key"
regex = '''(?i)(aws[_-]?access[_-]?key[_-]?id|aws[_-]?secret[_-]?access[_-]?key)['"]?\s*[:=]\s*['"][A-Z0-9]{20}['"]'''
tags = ["aws", "key", "secret"]
entropy = 4.0

[[rules]]
id = "tensorflow-gcp-keys"
description = "Google Cloud Platform service account keys"
regex = '''(?i)(gcp[_-]?service[_-]?account|google[_-]?application[_-]?credentials)['"]?\s*[:=]\s*['"]?\{.*\}['"]?'''
tags = ["gcp", "google", "service-account", "key"]
entropy = 3.5

[[rules]]
id = "tensorflow-github-token"
description = "GitHub Personal Access Token"
regex = '''(?i)(github[_-]?token|gh[_-]?pat|gh[_-]?token)['"]?\s*[:=]\s*['"]?gh[pousr]_[a-zA-Z0-9]{36}['"]?'''
tags = ["github", "token", "pat"]
entropy = 4.5

[[rules]]
id = "tensorflow-slack-token"
description = "Slack API Token"
regex = '''(?i)(slack[_-]?token|slack[_-]?api[_-]?token)['"]?\s*[:=]\s*['"]?xox[baprs]-[a-zA-Z0-9-]{10,}['"]?'''
tags = ["slack", "token"]
entropy = 4.0

[[rules]]
id = "tensorflow-database-url"
description = "Database connection strings with credentials"
regex = '''(?i)(database[_-]?url|db[_-]?url|connection[_-]?string)['"]?\s*[:=]\s*['"]?(postgres|mysql|mongodb|redis)://[^:]+:[^@]+@[^'"]+['"]?'''
tags = ["database", "connection", "credential"]
entropy = 3.5

[[rules]]
id = "tensorflow-private-key"
description = "Private keys (RSA, SSH, PGP)"
regex = '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
tags = ["private-key", "ssh", "pgp", "rsa"]
entropy = 0.0

[[rules]]
id = "tensorflow-jwt"
description = "JWT tokens"
regex = 'eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'
tags = ["jwt", "token"]
entropy = 4.0

[[rules]]
id = "tensorflow-generic-password"
description = "Generic password assignments"
regex = '''(?i)(password|passwd|pwd)['"]?\s*[:=]\s*['"][^'"]{8,}['"]'''
tags = ["password", "credential"]
entropy = 3.0